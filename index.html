<style>
/*
VOICE: calm, warm, a friend's travel folder, not a sales brochure.
IDEA: a ryokan welcome folder: one card per day, with an inked timeline and tucked-in option slips.
PICTURE: hand-drawn winter scenes (bathhouse steam, train in snow, monkeys in a pool) in a swipeable gallery.
COLOUR and TYPE: aizome indigo with snow white and one vermilion accent; Zen Kaku Gothic New headings, Noto Sans body.
LAYOUT: gallery on top, sticky day tabs, one day at a time, timeline with large hanging times.
*/
:root{color-scheme:light dark;
--bg:light-dark(#f7f8fa,#0f1424);--card:light-dark(#ffffff,#171e33);--ink:light-dark(#18223d,#e9ecf5);
--soft:light-dark(#5a6482,#a7afc6);--line:light-dark(#dfe3ec,#2a3350);--indigo:light-dark(#1f2d55,#2b3c70);
--ver:light-dark(#d4452a,#ff7a5c);--chip:light-dark(#eef1f7,#222a44);--ok:light-dark(#1d6b4f,#7fd6ac)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Zen Kaku Gothic New",system-ui,sans-serif;line-height:1.1;text-wrap:balance;margin:0}
a{color:var(--ver)}
.top{background:var(--indigo);color:#f2f4fb;padding:clamp(20px,4vw,40px) max(5vw,16px) 0}
.top h1{font-size:clamp(32px,6vw,48px)}
.top p{margin:6px 0 18px;color:#c9d0e6}
.gal{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:18px;scrollbar-width:thin}
.gal figure{flex:0 0 min(86%,520px);margin:0;scroll-snap-align:start;border-radius:14px;overflow:hidden;background:#101a38;position:relative}
.gal svg,.gal img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.gal figcaption{position:absolute;left:12px;bottom:10px;font-size:13px;color:#fff;background:rgba(10,16,36,.6);padding:3px 9px;border-radius:20px}
.galbar{display:flex;gap:8px;align-items:center;padding-bottom:20px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;font:600 15px "Noto Sans",sans-serif;cursor:pointer}
.btn:focus-visible,.tab:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--ver);outline-offset:2px}
label.btn{display:inline-flex;align-items:center}
.galbar small{color:#c9d0e6;font-size:13px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px max(5vw,16px)}
.tab{flex:none;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px "Noto Sans",sans-serif;cursor:pointer;text-align:left}
.tab b{display:block;font-size:12px;color:var(--soft);font-weight:600}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected=true] b{color:inherit;opacity:.75}
main{max-width:900px;margin:0 auto;padding:clamp(20px,4vw,40px) max(5vw,16px) 60px}
.dayhead h2{font-size:clamp(28px,5vw,40px)}
.dayhead .where{color:var(--ver);font-weight:600;margin:0 0 6px}
.dayhead p.lede{color:var(--soft);margin:10px 0 0;max-width:62ch}
.note{background:var(--chip);border-radius:12px;padding:12px 14px;margin:18px 0;font-size:15px}
.note strong{color:var(--ink)}
ol.tl{list-style:none;margin:26px 0 0;padding:0}
.step{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:0 14px;position:relative;padding-bottom:22px}
.step::before{content:"";position:absolute;left:calc(4.6em + 6px);top:10px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.time{font:700 19px "Zen Kaku Gothic New",sans-serif;white-space:nowrap;text-align:right;padding-top:1px}
.body{position:relative;padding-left:20px}
.body::before{content:"";position:absolute;left:-1px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--ver)}
.step.done .body::before{background:var(--ok);border-color:var(--ok)}
.body h3{font-size:19px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.body p{margin:4px 0 0;color:var(--soft);font-size:15.5px}
.chk{flex:none;display:inline-flex;align-items:center;gap:6px;font:500 13px "Noto Sans",sans-serif;color:var(--soft);cursor:pointer;min-height:32px}
.chk input{width:20px;height:20px;accent-color:var(--ok)}
details.opts{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px}
details.opts summary{cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:600}
details.opts summary::-webkit-details-marker{display:none}
details.opts summary::after{content:"+";font-size:22px;color:var(--ver)}
details.opts[open] summary::after{content:"\2212"}
.opt{padding:12px 14px;border-top:1px solid var(--line)}
.opt h4{margin:0;font-size:16px}
.opt p{margin:3px 0 0;font-size:14.5px;color:var(--soft)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12.5px;padding:2px 9px;border-radius:20px;background:var(--chip);color:var(--ink);white-space:nowrap}
.tag.d{background:var(--ok);color:var(--card)}
.tag.b{background:var(--ver);color:#fff}
.links{margin-top:6px;font-size:14px;display:flex;gap:14px;flex-wrap:wrap}
.links a{min-height:32px;display:inline-flex;align-items:center}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.pager .btn{border-color:var(--line);color:var(--ink);background:var(--card)}
footer{color:var(--soft);font-size:13px;text-align:center;padding:0 16px 40px}
.snow circle{animation:fall 9s linear infinite}
@keyframes fall{from{transform:translateY(-40px)}to{transform:translateY(460px)}}
@media(prefers-reduced-motion:reduce){.snow circle{animation:none}}
@media(max-width:600px){.step{grid-template-columns:3.6em minmax(0,1fr);gap:0 10px}.step::before{left:calc(3.6em + 4px)}.time{font-size:16px}.body h3{font-size:17px;flex-direction:column;gap:2px}}
</style>
</head>

{id:"day-2",tab:"Sun 31 Jan",short:"To Nozawa",where:"Tokyo to Nozawa Onsen",title:"Day 2 · Into the snow",lede:"One bullet train and one bus take you from Ginza to a hot spring village under a ski mountain.",
note:"<strong>Food on the move:</strong> train food is a gluten risk for Lisa. Pack her snacks from Tokyo. Konbini backup: plain salted salmon or umeboshi onigiri, after reading the whole label.",
steps:[
{t:"08:00",h:"Coffee and checkout",p:"Grab coffee near the hotel, then a short taxi to Tokyo Station (about 1 km)."},
{t:"09:00",h:"Hokuriku Shinkansen to Iiyama",p:"100 to 120 minutes, about one train an hour. Reserve seats. Watch the fields turn white after Nagano."},
{t:"11:00",h:"Nozawa Onsen Liner bus",p:"From Iiyama's Chikuma river exit, bus stop 4. Tickets from the machine by the stop. About 25 minutes, every 1 to 2 hours. Take the Liner, not the slower local bus with no luggage space. Buses get crowded with skiers, so a taxi or Uber is the fallback."},
{t:"12:00",h:"Arrive, drop bags",p:"Everything in the village is walkable from the bus terminal."},
{t:"12:30",h:"Coffee and lunch",p:"Get your bearings over food.",opts:[
{n:"Shizen",d:"Mostly vegan cafe and yoga space. Gluten-free options change daily.",tags:["a","b"],q:"Shizen Collective Nozawa Onsen"},
{n:"Tanuki cafe",d:"Hand-drip coffee with its own blend, just down from Oyu.",tags:["k"],q:"Tanuki cafe Nozawa Onsen"},
{n:"Nappa Cafe",d:"Locals' favourite for coffee, served in real cups, plus cakes.",tags:["k"],q:"Nappa Cafe Nozawa Onsen"}]},
{t:"14:00",h:"Walk the village",p:"Narrow lanes, canals and steam. Stop at Ogama, the boiling spring near 100°C where villagers cook eggs and vegetables. Only villagers cook there, but shops next to it sell onsen eggs."},
{t:"16:00",h:"First bath: Oyu",p:"The largest bathhouse, a wooden building in the centre. Free, open 06:00 to 23:00 in winter. The water is very hot: ease in, and ask before cooling it with cold water. The baths are kept by neighbourhood groups, so treat them like someone's home."},
{t:"18:30",h:"Dinner in the village",p:"Restaurants are small: book ahead and keep the booking.",opts:[
{n:"Village restaurant guide",d:"Filter for gluten-free, vegetarian and vegan.",tags:[],q:"Nozawa Onsen restaurants",u:"https://nozawahospitality.com/bars-restaurants"},
{n:"Pots Bar & Kitchen",d:"Gluten-free items marked on the menu. Reviewers rated cross-contact care only somewhat, so Lisa should still ask.",tags:["a"],q:"Pots Bar Kitchen Nozawa Onsen"}]}]},
{id:"day-3",tab:"Mon 1 Feb",short:"Monkeys",where:"Nozawa · Jigokudani",title:"Day 3 · Snow monkeys",lede:"A morning or day out to the macaques in their steaming pool, then baths and dinner back in Nozawa.",
note:"<strong>Book first:</strong> the monkey park uses timed-entry tickets booked online for winter 2026-27. The direct bus runs once a day each way, so its return time sets your time at the park. Its 2026-27 times aren't published yet.",
steps:[
{t:"AM",h:"Choose how to go",p:"Two ways from Nozawa.",opts:[
{n:"Direct winter bus",d:"Once a day each way, via Iiyama. Board at Nozawa Grand Hotel or the Chuo bus terminal. No reservation needed. Half a day.",tags:[],q:"Nozawa Onsen Chuo bus terminal",u:"https://www.snowmonkeyresorts.com/access/from-nozawa-how-to-get-to-snow-monkey/"},
{n:"Group day tour",d:"Monkeys, Zenko-ji temple and sake, meeting 09:00 at the Chuo bus terminal. A full day. The set lunch is a gluten risk: ask before booking, or bring Lisa's food.",tags:[],q:"Nozawa Onsen Chuo bus terminal",u:"https://www.snowmonkeyresorts.com/?p=1227"}]},
{t:"",h:"Forest walk to the park",p:"About 30 minutes on a wide, icy path through tall cedars. Wear microspikes or rent crampons at the trailhead."},
{t:"",h:"The monkeys",p:"Stand back, no food, no touching, no staring them down. Enza Cafe at the trailhead has good coffee; its food isn't checked for Lisa, so bring hers."},
{t:"PM",h:"Back in Nozawa",p:"Warm up with coffee, then a bath crawl: collect stamps at the checkpoints in front of each of the 13 bathhouses."},
{t:"18:30",h:"Dinner",p:"Same village guide as last night. Try somewhere new."}]},

const tabs=document.getElementById("tabs"),day=document.getElementById("day");
tabs.innerHTML=DAYS.map(d=>`<button class="tab" role="tab" id="t-${d.id}" aria-controls="day" aria-selected="false" data-id="${d.id}"><b>${d.tab}</b>${d.short}</button>`).join("");
let done={};try{done=JSON.parse(localStorage.getItem("jp-done")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("jp-done",JSON.stringify(done))}catch(e){}};
const optHTML=o=>`<div class="opt"><h4>${o.n}</h4><p>${o.d}</p>${o.tags.length?`<div class="tags">${o.tags.map(k=>`<span class="tag ${T[k][1]}">${T[k][0]}</span>`).join("")}</div>`:""}<div class="links"><a href="${map(o.q)}" target="_blank" rel="noopener">Map</a>${o.u?`<a href="${o.u}" target="_blank" rel="noopener">Details</a>`:""}</div></div>`;
function show(id){
const i=Math.max(0,DAYS.findIndex(d=>d.id===id)),d=DAYS[i];
for(const b of tabs.children){const on=b.dataset.id===d.id;b.setAttribute("aria-selected",on);if(on)b.scrollIntoView({inline:"nearest",block:"nearest"})}
day.innerHTML=`<div class="dayhead"><p class="where">${d.where}</p><h2>${d.title}</h2><p class="lede">${d.lede}</p></div>
<div class="note">${d.note}</div>
<ol class="tl">${d.steps.map((s,j)=>{const k=d.id+"-"+j;return `<li class="step${done[k]?" done":""}" data-k="${k}"><div class="time">${s.t}</div><div class="body"><h3><span>${s.h}</span></h3><p>${s.p}</p>${s.opts?`<details class="opts"${j<99?"":""}><summary>${s.opts.length} options</summary>${s.opts.map(optHTML).join("")}</details>`:""}</div></li>`}).join("")}</ol>
<div class="pager">${i>0?`<button class="btn" data-go="${DAYS[i-1].id}">Previous day</button>`:"<span></span>"}${i<DAYS.length-1?`<button class="btn" data-go="${DAYS[i+1].id}">Next day</button>`:"<span></span>"}</div>`;
}
const go=id=>{if(location.hash!=="#"+id)location.hash=id;else show(id)};
tabs.addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)go(b.dataset.id)});
day.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b){go(b.dataset.go);window.scrollTo({top:tabs.parentElement.offsetTop,behavior:"smooth"})}});
day.addEventListener("change",e=>{const c=e.target.closest("input[data-k]");if(!c)return;done[c.dataset.k]=c.checked;save();c.closest(".step").classList.toggle("done",c.checked)});
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||"day-1");
const gal=document.getElementById("gal");
const step=dir=>{const f=gal.querySelector("figure");gal.scrollBy({left:dir*(f?f.offsetWidth+12:300),behavior:"smooth"})};
document.getElementById("prev").addEventListener("click",()=>step(-1));
document.getElementById("next").addEventListener("click",()=>step(1));
gal.addEventListener("keydown",e=>{if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)});
document.getElementById("up").addEventListener("change",e=>{for(const f of e.target.files){const fig=document.createElement("figure");const img=document.createElement("img");img.src=URL.createObjectURL(f);img.alt="Your photo";const cap=document.createElement("figcaption");cap.textContent=f.name;fig.append(img,cap);gal.prepend(fig)}gal.scrollTo({left:0,behavior:"smooth"})});
}
</script>
